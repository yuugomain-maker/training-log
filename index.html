<!--
✅ CANVAS への引き継ぎサマリー

以下の事項を 新しい Canvas に確実に反映するための要望まとめです。

1. 有酸素（ウォーキング等）入力時の挙動改善
■ A. 表示される入力欄の問題

有酸素種目を選択しても、筋トレ用の項目（セット番号・重量・回数・RPE）が表示されたままになっている

本来は 非表示にしてほしい

■ B. 表示したい入力欄

有酸素の時は 以下だけを表示してほしい：

距離（km）

時間（分）

速さ（分/km または任意の表記）

■ C. バリデーション（エラー）の問題

「距離・時間・速さ」が空欄でもエラーが出てしまう

ウォーキングは「時間だけ」などパターンが多いため
→ 有酸素の時は すべて任意項目にしてエラー禁止

■ D. 必須チェックはこうしたい

日付：必須

種目：必須

筋トレの場合のみ → 重量・回数を必須

有酸素の場合 → 距離・時間・速さはすべて任意（空欄OK）

2. 部位選択ボタンが反応しない問題

「胸」「肩」「背中」「有酸素」などの部位ボタンがクリックしても反応しない状態

正しく反応し、選んだ部位に応じて「種目選択肢」を更新する必要あり

3. 種目選択後の UI 切り替え

種目を変更しても、筋トレ／有酸素のフォーム切り替えが反映されない場合がある

exerciseSelect.onchange 時に 常にフォーム表示切り替えが発動する仕組みが必要

4. バリデーションが複数箇所に重複して存在している可能性

「日付・種目・重量・回数は必須」と出る古いバリデーションが 複数残っている可能性が高い

新 CANVAS では、バリデーションロジックを 1 箇所に統一して管理すること

5. コード破損・重複の可能性

現在の app.js は複数の切り替えロジックが重複しており、UI が競合

新しい Canvas では
「UI 切り替え」「バリデーション」「種目生成」の3つの責務を明確に分ける必要あり

6. Goal（完成形のイメージ）
● 有酸素の場合

表示：距離・時間・速さ

非表示：セット番号・重量・回数・RPE

バリデーション：日付＋種目のみ必須（他はフリー）

● 筋トレの場合

表示：セット番号・重量・回数・RPE

非表示：距離・時間・速さ（すべて非表示）

バリデーション：日付＋種目＋重量＋回数 必須

● 種目変更時

即座にフォーム切り替えが反映されること
-->

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>トレーニングログ</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }

    body {
      margin: 0;
      padding: 0;
      background: #111827;
      color: #e5e7eb;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 2rem;
      font-weight: 800;

      text-transform: uppercase;

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 16px;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    section {
      background: #020617;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      margin-bottom: 8px;
    }

    section h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    input[type="date"],
    input[type="number"],
    input[type="text"],
    select {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: inherit;
      font-size: 0.9rem;
    }

    select option {
      background-color: #020617;
      color: #e5e7eb;
    }

    input::placeholder {
      color: #6b7280;
    }

    .date-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      margin-bottom: 8px;
    }

    .date-row label {
      flex: 1;
      margin-bottom: 0;
    }

    .custom-ex-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }

    .custom-ex-input {
      flex: 1;
    }

    .body-part-row {
      margin: 8px 0;
    }

    .body-part-label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .body-part-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .body-part-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .body-part-btn.active {
      background: #22c55e;
      border-color: #22c55e;
      color: #022c22;
    }

    button[type="submit"] {
      padding: 8px 10px;
      border-radius: 999px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      background: #22c55e;
      color: #022c22;
      cursor: pointer;
      transition: transform 0.05s ease-out, box-shadow 0.05s ease-out, background 0.1s ease-out;
    }

    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(34, 197, 94, 0.35);
      background: #4ade80;
    }

    button[type="submit"]:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .btn-secondary {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background: #0b1120;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .button-row button[type="submit"] {
      flex: 1;
    }

    .hint {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 4px;
    }

    #log-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
      max-height: 320px;
      overflow-y: auto;
      font-size: 0.85rem;
    }

    #log-list li {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #111827;
      background: #020617;
      margin-bottom: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    #log-list li:hover {
      background: #0b1120;
    }

    .log-main-text {
      flex: 1;
    }

    .log-delete-hint {
      font-size: 0.7rem;
      color: #6b7280;
      white-space: nowrap;
    }

    .chart-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }

    .chart-controls select {
      min-width: 140px;
    }

    canvas {
      background: #020617;
      border-radius: 8px;
      border: 1px solid #111827;
    }

    #stats p {
      margin: 4px 0;
      font-size: 0.9rem;
    }

    #history h3 {
      margin-bottom: 4px;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    #history ul {
      margin: 0 0 4px 1rem;
      padding-left: 0;
      font-size: 0.85rem;
    }

    #history li {
      margin-bottom: 2px;
    }

    #history p {
      margin: 0 0 4px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    #date-session-summary {
      font-size: 0.85rem;
      margin-top: 4px;
    }

    #date-session-summary h3 {
      font-size: 0.95rem;
      margin: 8px 0 4px;
    }

    #date-session-summary ul {
      margin: 0 0 4px 1rem;
      padding-left: 0;
      font-size: 0.85rem;
    }

    #date-session-summary li {
      margin-bottom: 2px;
    }

    /* 筋トレ／有酸素の切り替え用 */
    .strength-field {}
    .cardio-field {
      display: none;
    }
      .cardio-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 6px;
    }

    .cardio-row label {
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>トレーニングログ</h1>
    </header>

    <main>
      <!-- 左カラム：入力フォーム + 種目別履歴 + グラフ -->
      <div>
        <section>
          <h2>入力フォーム</h2>
          <form id="log-form">
            <label>
              日付・体重
              <div class="date-row">
                <input type="date" id="date" />
                <button type="button" id="today-btn" class="btn-secondary">今日</button>
                <input
                  type="number"
                  id="bodyWeight"
                  inputmode="decimal"
                  step="0.1"
                  placeholder="体重 (kg)"
                />
              </div>
            </label>

            <div class="body-part-row">
              <span class="body-part-label">部位</span>
              <div class="body-part-buttons">
                <button type="button" class="body-part-btn active" data-body-part="胸">胸</button>
                <button type="button" class="body-part-btn" data-body-part="肩">肩</button>
                <button type="button" class="body-part-btn" data-body-part="背中">背中</button>
                <button type="button" class="body-part-btn" data-body-part="脚・下半身">脚・下半身</button>
                <button type="button" class="body-part-btn" data-body-part="腕">腕</button>
                <button type="button" class="body-part-btn" data-body-part="腹">腹</button>
                <button type="button" class="body-part-btn" data-body-part="有酸素">有酸素</button>
                <button type="button" class="body-part-btn" data-body-part="その他">その他</button>
              </div>
            </div>

            <label>
              種目
              <select id="exercise">
                <option value="">選択してください</option>
                <optgroup label="胸">
                  <option value="ベンチプレス">ベンチプレス</option>
                  <option value="インクラインダンベルプレス">インクラインダンベルプレス</option>
                </optgroup>
                <optgroup label="肩">
                  <option value="オーバーヘッドプレス">オーバーヘッドプレス</option>
                </optgroup>
                <optgroup label="背中">
                  <option value="ラットプルダウン">ラットプルダウン</option>
                  <option value="シーテッドロウ">シーテッドロウ</option>
                  <option value="ローロウ">ローロウ</option>
                  <option value="リアデルトフライ">リアデルトフライ</option>
                </optgroup>
                <optgroup label="脚・下半身">
                  <option value="スクワット">スクワット</option>
                  <option value="デッドリフト">デッドリフト</option>
                  <option value="ルーマニアンデッドリフト">ルーマニアンデッドリフト</option>
                  <option value="レッグプレス">レッグプレス</option>
                  <option value="レッグカール">レッグカール</option>
                  <option value="レッグエクステンション">レッグエクステンション</option>
                </optgroup>
                <optgroup label="腕">
                  <option value="ケーブルカール">ケーブルカール</option>
                  <option value="ハンマーカール">ハンマーカール</option>
                  <option value="オーバーヘッドエクステンション">オーバーヘッドエクステンション</option>
                </optgroup>
                <optgroup label="腹">
                  <option value="ケーブルクランチ">ケーブルクランチ</option>
                  <option value="アブローラー">アブローラー</option>
                </optgroup>
                <optgroup label="有酸素">
                  <option value="ウォーキング">ウォーキング</option>
                  <option value="バイク">バイク</option>
                </optgroup>
                <optgroup label="その他">
                  <option value="ロータリートルソー">ロータリートルソー</option>
                  <option value="その他">その他</option>
                </optgroup>
                <optgroup id="custom-ex-group" label="カスタム"></optgroup>
              </select>
              <div class="custom-ex-row">
                <input
                  type="text"
                  id="custom-ex-input"
                  class="custom-ex-input"
                  placeholder="新しい種目名を入力"
                />
                <button type="button" id="add-custom-ex-btn" class="btn-secondary">
                  種目を追加
                </button>
              </div>
            </label>

            <div class="strength-field">
              <label>
                セット番号
                <input type="number" id="setNo" min="1" value="1" />
              </label>

              <label>
                重量 (kg)
                <input type="number" id="weight" inputmode="decimal" step="0.1" />
              </label>

              <label>
                回数
                <input type="number" id="reps" inputmode="numeric" />
              </label>

              <label>
                RPE
                <input type="number" id="rpe" step="0.5" min="5" max="10" />
              </label>
            </div>

            <div class="cardio-field">
              <label>
                距離 (km)
                <input type="number" id="distance" inputmode="decimal" step="0.1" />
              </label>

              <label>
                時間 (分)
                <input type="number" id="duration" inputmode="decimal" step="0.1" />
              </label>

              <label>
                速さ
                <input type="text" id="speed" placeholder="例: 時速6kmなど" />
              </label>
            </div>

            <label>
              メモ
              <input
                type="text"
                id="memo"
                placeholder="フォーム・体調・補助あり / コースなど"
              />
            </label>

            <div id="cardio-fields" class="cardio-row">
              <label>
                距離 (km)
                <input
                  type="number"
                  id="cardio-distance"
                  inputmode="decimal"
                  step="0.01"
                />
              </label>
              <label>
                時間 (分)
                <input
                  type="number"
                  id="cardio-duration"
                  inputmode="numeric"
                  step="1"
                />
              </label>
              <label>
                速さ (分/km)
                <input
                  type="number"
                  id="cardio-speed"
                  inputmode="decimal"
                  step="0.1"
                />
              </label>
            </div>

            <div class="button-row">
              <button type="submit">このセットを追加</button>
              <button type="button" id="copy-first-set-btn" class="btn-secondary">
                1セット目をコピー
              </button>
            </div>
            <p class="hint">
              ※ 同じ日・同じ種目のときは、1セット目を登録後「1セット目をコピー」で 2〜4 セット目を素早く追加できます。
            </p>
          </form>
        </section>

        <section>
          <h2>種目別履歴（最近 3 回のトレーニング日）</h2>
          <div id="history">種目を選択すると履歴が表示されます。</div>
        </section>

        <section>
          <h2>推定 1RM グラフ</h2>
          <div class="chart-controls">
            <label>
              種目：
              <select id="exercise-select">
                <option value="">記録がある種目から選択</option>
              </select>
            </label>

            <label>
              期間：
              <select id="range-select">
                <option value="all">全期間</option>
                <option value="30">直近 30 日</option>
                <option value="90">直近 90 日</option>
              </select>
            </label>
          </div>

          <canvas id="rmChart" height="200"></canvas>
        </section>
      </div>

      <!-- 右カラム：トレ日別一覧 + 統計 + 記録一覧 -->
      <div>
        <section>
          <h2>トレーニング日別一覧</h2>
          <p class="hint">前回のトレーニング日などを選ぶと、その日に行った全種目とセットが表示されます。</p>
          <label>
            トレーニング日：
            <select id="date-session-select">
              <option value="">日付を選択</option>
            </select>
          </label>
          <div id="date-session-summary"></div>
        </section>

        <section>
          <h2>統計</h2>
          <div id="stats">種目を選択すると統計が表示されます。</div>
        </section>

        <section>
          <h2>記録一覧</h2>
          <p class="hint">※ 一覧の行をクリックすると、その記録を削除できます。</p>
          <ul id="log-list"></ul>
        </section>
      </div>
    </main>
  </div>

// ==============================

// ==============================
/**

 * @property {string} date - YYYY-MM-DD

const BODY_PARTS = ["胸", "肩", "背中", "脚・下半身", "腕", "腹", "有酸素", "その他"];

const DEFAULT_EXERCISES = {
  胸: ["ベンチプレス", "インクラインダンベルプレス", "チェストプレス"],
  肩: ["オーバーヘッドプレス", "ダンベルショルダープレス", "サイドレイズ"],

// ==============================

const STORAGE_KEY = "trainingLog_v3";
const CUSTOM_EXERCISE_KEY = "trainingCustomExercises_v3";

function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(parsed)) return [];
    return parsed;
  } catch (e) {
    console.warn("loadRecords failed:", e);
    return [];
  }
}

function saveLogsToLocal(logs) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
  } catch (e) {
    console.error("saveLogsToLocal failed:", e);
  }
}

function loadCustomExercises() {
  try {
    const raw = localStorage.getItem(CUSTOM_EXERCISE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.warn("loadCustomExercises failed:", e);
    return [];
  }
}

function saveCustomExercises(list) {
  try {
    localStorage.setItem(CUSTOM_EXERCISE_KEY, JSON.stringify(list));
  } catch (e) {
    console.error("saveCustomExercises failed:", e);
  }
}

function getCustomExercisesFor(bodyPart) {
  const all = loadCustomExercises();
  return all.filter((c) => c.bodyPart === bodyPart).map((c) => c.name);
}

function getAllExerciseNames() {
  const set = new Set();
  BODY_PARTS.forEach((bp) => {
    (DEFAULT_EXERCISES[bp] || []).forEach((name) => set.add(name));
  });
  loadCustomExercises().forEach((c) => set.add(c.name));
  return Array.from(set);
}

function getCardioExerciseNames() {
  const defaults = DEFAULT_EXERCISES[CARDIO_BODY_PART] || [];
  const customs = getCustomExercisesFor(CARDIO_BODY_PART);
  return [...defaults, ...customs];
}

function isCardioExercise(exerciseName) {
  return getCardioExerciseNames().includes(exerciseName);
}

// ==============================
// ユーティリティ
// ==============================
function estimate1RM(weight, reps) {
  if (!weight || !reps) return null;
  const rm = weight * (1 + reps / 30);
  return Math.round(rm * 10) / 10;
}

function isWithinRange(dateStr, rangeValue) {
  if (!dateStr) return false;
  if (rangeValue === "all") return true;

  const days = parseInt(rangeValue, 10);
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return false;

  const today = new Date();
  const diffMs = today - d;
  const diffDays = diffMs / (1000 * 60 * 60 * 24);
  return diffDays <= days;
}

function getExerciseSessions(exerciseName, rangeValue) {
  // 有酸素は 1RM グラフ・統計の対象外
  if (isCardioExercise(exerciseName)) return [];

  const filteredLogs = logs.filter(
    (log) => log.exercise === exerciseName && isWithinRange(log.date, rangeValue),
  );

  if (filteredLogs.length === 0) return [];

  const map = /** @type {Record<string, TrainingLog[]>} */ ({});
  filteredLogs.forEach((log) => {
    if (!map[log.date]) map[log.date] = [];
    map[log.date].push(log);
  });

  const dates = Object.keys(map).sort();

  return dates.map((date) => {
    const sets = map[date]
      .slice()
      .sort((a, b) => (a.setNo || 0) - (b.setNo || 0));

    let topSet = sets[0];
    sets.forEach((s) => {
      if (
        s.weight > topSet.weight ||
        (s.weight === topSet.weight && s.reps > topSet.reps)
      ) {
        topSet = s;
      }
    });

    const top1RM = estimate1RM(topSet.weight, topSet.reps) ?? 0;
    const volume = sets.reduce((sum, s) => sum + s.weight * s.reps, 0);

    return { date, sets, topSet, top1RM, volume };
  });
}

function getTodayString() {

}

}

function renderAll() {
  renderList();
  updateExerciseOptionsForGraph();
  updateTrainingDateOptions();

  const ex = /** @type {HTMLSelectElement} */ (exerciseSelectForGraph).value;
  const range = /** @type {HTMLSelectElement} */ (rangeSelect).value;

  if (ex && !isCardioExercise(ex)) {
    updateRmChart(ex, range);
    renderStats(ex, range);
    renderHistory(ex, range);
  } else {
    if (rmChart) {
      rmChart.destroy();
      rmChart = null;
    }
    statsDiv.textContent = "種目を選択すると統計が表示されます。";
    historyDiv.textContent = "種目を選択すると履歴が表示されます。";
  }

  const selectedDate = /** @type {HTMLSelectElement} */ (
    dateSessionSelect
  ).value;
  if (selectedDate) {
    renderSessionByDate(selectedDate);
  } else {
    dateSessionSummary.textContent = "記録がある日付から選択してください。";
  }
}

function renderList() {
  list.innerHTML = "";

  const sorted = logs.slice().sort((a, b) => {
    if (a.date === b.date) return (a.setNo || 0) - (b.setNo || 0);
    return a.date.localeCompare(b.date);
  });

  sorted.forEach((log) => {
    const li = document.createElement("li");

    const main = document.createElement("span");
    main.className = "log-main-text";

    let text;
    if (isCardioExercise(log.exercise)) {
      const parts = [];
      if (log.distance) parts.push(`${log.distance}km`);
      if (log.duration) parts.push(`${log.duration}分`);
      if (log.speed) parts.push(`${log.speed}`);
      text = `${log.date} / ${log.exercise} / ${parts.join(" / ")}`;
    } else {
      text = `${log.date} / ${log.exercise} / ${log.setNo}セット目 / ${log.weight}kg × ${log.reps}回`;
      if (log.rpe) {
        text += ` (RPE ${log.rpe})`;
      }
    }

    if (log.bodyWeight != null) {
      text += ` / 体重 ${log.bodyWeight}kg`;
    }
    if (log.memo) {
      text += ` - ${log.memo}`;
    }
    main.textContent = text;

    const hint = document.createElement("span");
    hint.className = "log-delete-hint";
    hint.textContent = "タップで削除";

    li.appendChild(main);
    li.appendChild(hint);

    li.addEventListener("click", () => {
      if (confirm("この記録を削除しますか？")) {
        const originalIndex = logs.findIndex(
          (l) =>
            l.date === log.date &&
            l.exercise === log.exercise &&
            l.setNo === log.setNo &&
            l.weight === log.weight &&
            l.reps === log.reps &&
            l.rpe === log.rpe &&
            l.memo === log.memo &&
            (l.bodyWeight ?? null) === (log.bodyWeight ?? null) &&
            (l.distance ?? null) === (log.distance ?? null) &&
            (l.duration ?? null) === (log.duration ?? null) &&
            (l.speed ?? null) === (log.speed ?? null),
        );
        if (originalIndex !== -1) {
          logs.splice(originalIndex, 1);
          saveLogsToLocal(logs);
          renderAll();
        }
      }
    });

    list.appendChild(li);
  });
}

function updateExerciseOptionsForGraph() {
  const exercises = [
    ...new Set(
      logs
        .filter((log) => !isCardioExercise(log.exercise))
        .map((log) => log.exercise)
        .filter((name) => !!name),
    ),
  ];

  const current = /** @type {HTMLSelectElement} */ (
    exerciseSelectForGraph
  ).value;
  exerciseSelectForGraph.innerHTML = "";

  if (exercises.length === 0) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "まだ記録がありません";
    exerciseSelectForGraph.appendChild(option);
    return;
  }

  exercises.forEach((name) => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    exerciseSelectForGraph.appendChild(option);
  });

  if (current && exercises.includes(current)) {
    exerciseSelectForGraph.value = current;
  } else if (!exerciseSelectForGraph.value && exercises.length > 0) {
    exerciseSelectForGraph.value = exercises[0];
  }
}

function updateTrainingDateOptions() {
  const dates = [
    ...new Set(logs.map((log) => log.date).filter((d) => !!d)),
  ].sort((a, b) => b.localeCompare(a));

  const selectEl = /** @type {HTMLSelectElement} */ (dateSessionSelect);
  const current = selectEl.value;

  selectEl.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = dates.length ? "日付を選択" : "まだ記録がありません";
  selectEl.appendChild(placeholder);

  dates.forEach((d) => {
    const option = document.createElement("option");
    option.value = d;
    option.textContent = d;
    selectEl.appendChild(option);
  });

  if (current && dates.includes(current)) {
    selectEl.value = current;
  } else if (!current && dates.length > 0) {
    selectEl.value = dates[0];
  }
}

function updateRmChart(exerciseName, rangeValue) {
  if (!exerciseName || isCardioExercise(exerciseName)) return;

  const sessions = getExerciseSessions(exerciseName, rangeValue);
  const logsForChart = sessions.flatMap((s) =>
    s.sets.map((set) => ({
      label: `${s.date} (${set.setNo}セット目)`,
      rm: estimate1RM(set.weight, set.reps),
    })),
  );

  const labels = logsForChart.map((x) => x.label);
  const data = logsForChart.map((x) => x.rm);

  const ctx = document.getElementById("rmChart").getContext("2d");

  if (rmChart) {
    rmChart.destroy();
  }

  rmChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: `${exerciseName} の推定 1RM`,
          data,
          tension: 0.2,
          pointRadius: 3,
        },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: {
            boxWidth: 16,
          },
        },
      },
      scales: {
        y: {
          title: {
            display: true,
            text: "推定 1RM (kg)",
          },
        },
        x: {
          title: {
            display: true,
            text: "日付 / セット",
          },
        },
      },
    },
  });
}

function renderStats(exerciseName, rangeValue) {
  statsDiv.innerHTML = "";

  if (!exerciseName || isCardioExercise(exerciseName)) {
    statsDiv.textContent = "種目を選択すると統計が表示されます。";
    return;
  }

  const sessions = getExerciseSessions(exerciseName, rangeValue);
  if (sessions.length === 0) {
    statsDiv.textContent = "選択中の期間に記録がありません。";
    return;
  }

  const max1RM = Math.max(...sessions.map((s) => s.top1RM));
  const avg1RM =
    Math.round(
      (sessions.reduce((sum, s) => sum + s.top1RM, 0) / sessions.length) * 10,
    ) / 10;

  const avgVolume = Math.round(
    sessions.reduce((sum, s) => sum + s.volume, 0) / sessions.length,
  );

  const p1 = document.createElement("p");
  p1.textContent = `最大 1RM：${max1RM} kg`;

  const p2 = document.createElement("p");
  p2.textContent = `平均 1RM（トップセット）：${avg1RM} kg`;

  const p3 = document.createElement("p");
  p3.textContent = `平均ボリューム（1 セッションあたり）：${avgVolume} kg×rep`;

  statsDiv.appendChild(p1);
  statsDiv.appendChild(p2);
  statsDiv.appendChild(p3);
}

function formatDiff(value, unit) {
  if (value > 0) return `+${value}${unit}`;
  if (value < 0) return `${value}${unit}`;
  return `±0${unit}`;
}

function renderHistory(exerciseName, rangeValue) {
  historyDiv.innerHTML = "";

  if (!exerciseName || isCardioExercise(exerciseName)) {
    historyDiv.textContent = "種目を選択すると履歴が表示されます。";
    return;
  }

  const sessions = getExerciseSessions(exerciseName, rangeValue);
  if (sessions.length === 0) {
    historyDiv.textContent = "この期間には記録がありません。";
    return;
  }

  let shown = 0;
  for (let i = sessions.length - 1; i >= 0 && shown < 3; i--, shown++) {
    const s = sessions[i];
    const prev = i > 0 ? sessions[i - 1] : null;

    const title = document.createElement("h3");
    title.textContent = s.date;
    historyDiv.appendChild(title);

    const ul = document.createElement("ul");
    s.sets.forEach((log) => {
      let text = `${log.setNo}セット目: ${log.weight}kg × ${log.reps}回`;
      if (log.rpe) text += ` (RPE ${log.rpe})`;
      if (log.memo) text += ` - ${log.memo}`;
      const li = document.createElement("li");
      li.textContent = text;
      ul.appendChild(li);
    });
    historyDiv.appendChild(ul);

    const p = document.createElement("p");
    if (prev) {
      const diffW = s.topSet.weight - prev.topSet.weight;
      const diffR = s.topSet.reps - prev.topSet.reps;
      const diffRM = Math.round((s.top1RM - prev.top1RM) * 10) / 10;
      const diffVol = s.volume - prev.volume;

      p.textContent =
        `前回比（トップセット基準）: ` +
        `重量 ${formatDiff(diffW, "kg")} / ` +
        `回数 ${formatDiff(diffR, "回")} / ` +
        `1RM ${formatDiff(diffRM, "kg")} / ` +
        `ボリューム ${formatDiff(diffVol, "kg×rep")}`;
    } else {
      p.textContent = "この種目の初回セッションです。";
    }
    historyDiv.appendChild(p);
  }
}

function renderSessionByDate(dateStr) {
  dateSessionSummary.innerHTML = "";
  if (!dateStr) {
    dateSessionSummary.textContent = "記録がある日付から選択してください。";
    return;
  }

  const logsForDate = logs
    .filter((l) => l.date === dateStr)
    .sort((a, b) => {
      if (a.exercise === b.exercise) return (a.setNo || 0) - (b.setNo || 0);
      return a.exercise.localeCompare(b.exercise);
    });

  if (logsForDate.length === 0) {
    dateSessionSummary.textContent = "この日付の記録はありません。";
    return;
  }

  const bwLog = logsForDate.find((l) => l.bodyWeight != null);
  if (bwLog && bwLog.bodyWeight != null) {
    const pBw = document.createElement("p");
    pBw.textContent = `体重: ${bwLog.bodyWeight} kg`;
    dateSessionSummary.appendChild(pBw);
  }

  const map = /** @type {Record<string, TrainingLog[]>} */ ({});
  logsForDate.forEach((log) => {
    if (!map[log.exercise]) map[log.exercise] = [];
    map[log.exercise].push(log);
  });

  Object.keys(map)
    .sort()
    .forEach((exercise) => {
      const h3 = document.createElement("h3");
      h3.textContent = exercise;
      dateSessionSummary.appendChild(h3);

      const ul = document.createElement("ul");
      const isCardio = isCardioExercise(exercise);

      map[exercise]
        .slice()
        .sort((a, b) => (a.setNo || 0) - (b.setNo || 0))
        .forEach((log) => {
          let text;
          if (isCardio) {
            const parts = [];
            if (log.distance) parts.push(`${log.distance}km`);
            if (log.duration) parts.push(`${log.duration}分`);
            if (log.speed) parts.push(`${log.speed}`);
            text = parts.join(" / ");
          } else {
            text = `${log.setNo}セット目: ${log.weight}kg × ${log.reps}回`;
            if (log.rpe) text += ` (RPE ${log.rpe})`;
          }
          if (log.memo) text += ` - ${log.memo}`;
          const li = document.createElement("li");
          li.textContent = text;
          ul.appendChild(li);
        });
      dateSessionSummary.appendChild(ul);
    });
}

async function saveLogToCloud(log) {
  try {
    await addDoc(collection(db, "trainingLogs"), log);
    console.log("🔥 Firestore に保存成功:", log);
  } catch (e) {
    console.error("❌ Firestore 保存失敗:", e);
  }
}

async function loadLogsFromCloud() {
  try {
    const querySnapshot = await getDocs(collection(db, "trainingLogs"));
    const loadedLogs = querySnapshot.docs.map((doc) => doc.data());
    console.log("✅ Firestore から読み込み成功:", loadedLogs);
    return loadedLogs;
  } catch (e) {
    console.error("❌ Firestore 読み込み失敗:", e);
    return [];
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const date = /** @type {HTMLInputElement} */ (
    document.getElementById("date")
  ).value;
  const bodyWeightRaw = /** @type {HTMLInputElement} */ (
    document.getElementById("bodyWeight")
  ).value;
  const exercise = /** @type {HTMLSelectElement} */ (
    document.getElementById("exercise")
  ).value;

  const setNoInputEl = /** @type {HTMLInputElement} */ (
    document.getElementById("setNo")
  );
  const weightInputEl = /** @type {HTMLInputElement} */ (
    document.getElementById("weight")
  );
  const repsInputEl = /** @type {HTMLInputElement} */ (
    document.getElementById("reps")
  );
  const rpeInputEl = /** @type {HTMLInputElement} */ (
    document.getElementById("rpe")
  );
  const memoInputEl = /** @type {HTMLInputElement} */ (
    document.getElementById("memo")
  );

  const setNo = Number(setNoInputEl?.value || "1") || 1;
  let weight = Number(weightInputEl?.value || "0");
  let reps = Number(repsInputEl?.value || "0");
  const rpe = rpeInputEl?.value ?? "";
  const memo = memoInputEl?.value ?? "";

  if (!date || !exercise) {
    alert("日付・種目は必須です。");
    return;
  }

  const cardioDistanceInput = /** @type {HTMLInputElement | null} */ (
    document.getElementById("cardio-distance")
  );
  const cardioDurationInput = /** @type {HTMLInputElement | null} */ (
    document.getElementById("cardio-duration")
  );
  const cardioSpeedInput = /** @type {HTMLInputElement | null} */ (
    document.getElementById("cardio-speed")
  );

  const isCardio = isCardioExercise(exercise);

  const cardioDistance =
    cardioDistanceInput && cardioDistanceInput.value
      ? Number(cardioDistanceInput.value)
      : null;
  const cardioDuration =
    cardioDurationInput && cardioDurationInput.value
      ? Number(cardioDurationInput.value)
      : null;
  const cardioSpeed =
    cardioSpeedInput && cardioSpeedInput.value
      ? Number(cardioSpeedInput.value)
      : null;

  // 筋トレ種目のみ重量・回数を必須にする
  if (!isCardio && (!weight || !reps)) {
    alert("日付・種目・重量・回数は必須です。");
    return;
  }

  const bodyWeight = bodyWeightRaw ? Number(bodyWeightRaw) : null;

  /** @type {TrainingLog} */
  const newLog = {
    date,
    bodyWeight,
    exercise,
    setNo,
    weight: isCardio ? weight || 0 : weight,
    reps: isCardio ? reps || 0 : reps,
    rpe: isCardio ? null : rpe || null,
    memo: memo || "",
    distance: cardioDistance,
    duration: cardioDuration,
    speed: cardioSpeed,
  };

  // ローカル / Firestore / シートの 3 か所に保存
  logs.push(newLog);
  saveLogsToLocal(logs); // localStorage
  saveLogToCloud(newLog); // Firestore
  sendLogToSheet(newLog); // Google スプレッドシート

  // 次セット入力をしやすくする（体重はそのまま残す）
  setNoInputEl.value = String(setNo + 1);

  if (weightInputEl) weightInputEl.value = "";
  if (repsInputEl) repsInputEl.value = "";
  if (rpeInputEl) rpeInputEl.value = "";
  if (memoInputEl) memoInputEl.value = "";
  if (cardioDistanceInput) cardioDistanceInput.value = "";
  if (cardioDurationInput) cardioDurationInput.value = "";
  if (cardioSpeedInput) cardioSpeedInput.value = "";

  renderAll();
});
